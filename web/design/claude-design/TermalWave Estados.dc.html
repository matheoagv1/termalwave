<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>html,body{margin:0;background:#0b0d0f}a{color:oklch(0.82 0.15 78)}a:hover{color:#e8ecef}</style>
</helmet>
<section style="padding:40px;font:13px/1.4 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;color:#e8ecef;width:2800px">
  <h1 style="margin:0 0 4px;font:500 22px var(--sans,system-ui)">TermalWave: estados</h1>
  <p style="margin:0 0 28px;color:#a2acb5">Cada tarjeta es el prototipo real con un escenario en la URL. Escritorio 1280×800 y móvil 390×844, a media escala. <a href="TermalWave.dc.html">Abrir el prototipo</a></p>
  <div style="display:flex;flex-wrap:wrap;gap:36px 28px;align-items:flex-start">
    <sc-for list="{{ states }}" as="s" hint-placeholder-count="6">
      <div id="{{ s.id }}" style="display:flex;flex-direction:column;gap:8px">
        <div style="font:12px ui-monospace,Menlo,monospace;color:#a2acb5"><span style="padding:1px 6px;border:1px solid #3a4651;margin-right:8px">{{ s.id }}</span>{{ s.label }}</div>
        <div style="display:flex;gap:16px;align-items:flex-start">
          <div style="width:640px;height:400px;border:1px solid #3a4651;overflow:hidden;position:relative"><iframe src="{{ s.deskSrc }}" loading="lazy" title="{{ s.label }}" style="width:1280px;height:800px;border:0;transform:scale(.5);transform-origin:0 0;position:absolute;left:0;top:0"></iframe></div>
          <div style="width:195px;height:422px;border:1px solid #3a4651;overflow:hidden;position:relative"><iframe src="{{ s.mobSrc }}" loading="lazy" title="{{ s.label }}" style="width:390px;height:844px;border:0;transform:scale(.5);transform-origin:0 0;position:absolute;left:0;top:0"></iframe></div>
        </div>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const L = [
      ['Primer uso', '#c=orbit'], ['Explorar el mundo', '#c=orbit&explorar=1'], ['Cargando', '#escenario=cargando'],
      ['Territorio', '#c=territory&l=suelo'], ['Sin conexión', '#escenario=sin-conexion&l=radar'],
      ['Falta imagen de una capa', '#c=territory&l=contaminacion&t=q-2023-2'], ['Error de configuración', '#escenario=error-config'],
      ['Relieve no disponible', '#escenario=sin-relieve&tilt=0'], ['Tarjeta de detalle', '#c=territory&l=suelo&pick=suelo-0'],
      ['Modo comparar (compuesto contra pasada)', '#c=territory&l=incendios&t=a-2026-03-29&cmp=y-2022,0.5'],
      ['Segmento expandido', '#c=territory&zoom=meses&t=m-2024-08'], ['Tramo sin datos', '#escenario=tramo-vacio&zoom=anio'],
      ['Un solo tramo', '#escenario=un-tramo'], ['Un solo punto', '#escenario=un-punto'], ['Rango muy largo', '#escenario=rango-largo'],
      ['Ficha como hoja (móvil)', '#c=territory&ficha=1&tab=lectura'], ['Ayuda de teclado', '#c=territory&ayuda=1'],
    ];
    const states = [];
    L.forEach(([label, h], i) => {
      const dark = i % 2 === 0, mk = (t) => 'TermalWave.dc.html' + h + (h.includes('escenario') || h.includes('c=') ? '&' : '') + 'tema=' + t;
      states.push({ id: '1' + String.fromCharCode(97 + i), label: label + (dark ? ' (oscuro escritorio, claro móvil)' : ' (claro escritorio, oscuro móvil)'), deskSrc: mk(dark ? 'oscuro' : 'claro'), mobSrc: mk(dark ? 'claro' : 'oscuro') });
    });
    return { states };
  }
}
</script>
</body>
</html>
