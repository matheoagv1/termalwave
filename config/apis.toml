product = "photon"
license = "ODbL (OpenStreetMap)"
attribution = "© OpenStreetMap contributors (via Photon/Komoot)"
rate_limit = "1/s"
docs_url = "https://github.com/komoot/photon"
quality_rank = 10

[providers.open_meteo_geocode]
