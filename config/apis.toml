# --- elevation (server-side only) ---

[elevation]
order = ["open_meteo_elevation", "opentopodata_srtm30m"]
strategy = "first_available_per_point"
disagree_meters = 30.0

[elevation.endpoints]
open_meteo_elevation = "https://api.open-meteo.com/v1/elevation"
opentopodata_srtm30m = "https://api.opentopodata.org/v1/srtm30m"

[providers.open_meteo_elevation]
kind = "elevation"
module = "termalwave.providers.elevation.open_meteo"
credential = ""
product = "open-meteo-elevation"
dem = "copernicus-glo90"
resolution_m = 90
license = "Open-Meteo / Copernicus DEM CC BY 4.0"
attribution = "Elevation data by Open-Meteo.com (CC BY 4.0), Copernicus DEM"
rate_limit = "600/min"
daily_cap = 10000
docs_url = "https://open-meteo.com/en/docs/elevation-api"
