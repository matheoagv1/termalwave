module = "termalwave.providers.elevation.opentopodata"
credential = ""
product = "srtm30m"
dem = "srtm30m"
resolution_m = 30
license = "SRTM NASA/USGS via OpenTopoData"
attribution = "Elevation from SRTM (NASA/USGS) via OpenTopoData"
rate_limit = "1/s"
daily_cap = 1000
docs_url = "https://www.opentopodata.org/"
quality_rank = 20

# --- geocode (server-side only; no browser autocomplete) ---

[geocode]
search = ["photon", "open_meteo_geocode", "nominatim"]
reverse = ["photon", "nominatim"]
strategy = "first_nonempty"
dedupe_distance_m = 500.0
user_agent = "TermalWave/0.1 (+https://termalwave.space)"
rate_limit = "1/s"

[geocode.endpoints]
photon = "https://photon.komoot.io/api/"
photon_reverse = "https://photon.komoot.io/reverse"
open_meteo_geocode = "https://geocoding-api.open-meteo.com/v1/search"
nominatim = "https://nominatim.openstreetmap.org/search"
nominatim_reverse = "https://nominatim.openstreetmap.org/reverse"
google_places = "https://places.googleapis.com/v1/places:searchText"

# browser search: edge proxy first (holds server keys, shared cache),
# keyless direct calls when the app is served without the proxy
[geocode.web]
endpoint = "/api/search"
proxy = ["google_places", "photon", "open_meteo_geocode"]
direct = ["photon", "open_meteo_geocode"]
limit = 6
cache_ttl_s = 604800

[providers.photon]
