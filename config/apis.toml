# --- basemaps (frontend config only; emitted into app-config.json) ---

[basemaps]
# daily gibs mosaics have black gaps between orbits; default must be gap-free
default = "eox_s2cloudless_2025"
# Street raster is OSM. CARTO raster now returns an API-key image, so it is not a base.
# OpenFreeMap is a vector style, not a raster tile template.
# GIBS truecolor lags: VIIRS often ~10–14d behind; MODIS ~2–4d. date_lag_days per entry.
list = [
  "gibs_modis_truecolor",
  "gibs_viirs_truecolor",
  "osm_standard",
  "esri_world_imagery",
  "openfreemap_liberty",
  "eox_s2cloudless_2025",
  "gibs_blue_marble",
  "cesium_world_terrain",
]
engine_primary = "maplibre"
engine_fallback_2d = "leaflet"
cesium_ion_asset_world_terrain = 1
cesium_ion_asset_sentinel2_test = 3954

[basemaps.entries.gibs_modis_truecolor]
id = "gibs_modis_truecolor"
# drawn over a gap-free layer so orbit gaps show earth, not black
underlay = "gibs_blue_marble"
label = "NASA GIBS MODIS"
kind = "raster"
url_template = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/{date}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg"
attribution = "We acknowledge the use of imagery provided by services from NASA's Global Imagery Browse Services (GIBS), part of NASA's Earth Science Data and Information System (ESDIS)."
license = "NASA GIBS"
max_zoom = 9
time_dimension = true
date_lag_days = 4
docs_url = "https://wiki.earthdata.nasa.gov/display/GIBS"

[basemaps.entries.gibs_viirs_truecolor]
id = "gibs_viirs_truecolor"
# drawn over a gap-free layer so orbit gaps show earth, not black
underlay = "gibs_blue_marble"
label = "NASA GIBS VIIRS"
kind = "raster"
url_template = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/{date}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg"
attribution = "We acknowledge the use of imagery provided by services from NASA's Global Imagery Browse Services (GIBS), part of NASA's Earth Science Data and Information System (ESDIS)."
license = "NASA GIBS"
max_zoom = 9
time_dimension = true
date_lag_days = 14
docs_url = "https://wiki.earthdata.nasa.gov/display/GIBS"

[basemaps.entries.gibs_blue_marble]
id = "gibs_blue_marble"
label = "NASA Blue Marble"
kind = "raster"
url_template = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_NextGeneration/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg"
attribution = "We acknowledge the use of imagery provided by services from NASA's Global Imagery Browse Services (GIBS), part of NASA's Earth Science Data and Information System (ESDIS)."
license = "NASA GIBS"
max_zoom = 8
time_dimension = false
# fixed mosaic, never republished under the same url
cache_policy = "archive"
docs_url = "https://wiki.earthdata.nasa.gov/display/GIBS"

[basemaps.entries.osm_standard]
id = "osm_standard"
label = "Calles (OpenStreetMap)"
kind = "raster"
url_template = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
attribution = "© OpenStreetMap contributors"
license = "ODbL"
max_zoom = 19
tile_size = 256
time_dimension = false
docs_url = "https://operations.osmfoundation.org/policies/tiles/"
purpose = "streets"
do_not_store_tiles = true

[basemaps.entries.esri_world_imagery]
id = "esri_world_imagery"
label = "Imagen Esri"
kind = "raster"
# Esri World Imagery is XYZ with row before column: {z}/{y}/{x}
url_template = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
attribution = "Tiles © Esri, Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community"
license = "Esri"
max_zoom = 19
tile_size = 256
time_dimension = false
docs_url = "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
purpose = "imagery"
do_not_store_tiles = true

[basemaps.entries.openfreemap_liberty]
id = "openfreemap_liberty"
label = "Calles vector (OpenFreeMap)"
kind = "vector"
url_template = "https://tiles.openfreemap.org/styles/liberty"
attribution = "© OpenStreetMap contributors · OpenFreeMap © OpenMapTiles"
license = "ODbL / OpenMapTiles"
max_zoom = 14
time_dimension = false
docs_url = "https://openfreemap.org/"
engines = ["maplibre"]
purpose = "streets"

[basemaps.entries.eox_s2cloudless_2025]
id = "eox_s2cloudless_2025"
label = "Sentinel-2 sin nubes (EOX)"
kind = "raster"
url_template = "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2025_3857/default/g/{z}/{y}/{x}.jpg"
attribution = "EOxCloudless https://cloudless.eox.at by EOX IT Services GmbH (Contains modified Copernicus Sentinel data 2025)"
license = "CC BY-NC-SA 4.0"
max_zoom = 16
time_dimension = false
docs_url = "https://tiles.maps.eox.at/"
do_not_store_tiles = true

[basemaps.entries.cesium_world_terrain]
id = "cesium_world_terrain"
label = "Relieve Cesium"
kind = "terrain"
url_template = "ion://1"
attribution = "Cesium World Terrain · Cesium ion"
license = "Cesium ion"
max_zoom = 15
time_dimension = false
docs_url = "https://cesium.com/learn/cesiumjs/ref-doc/createWorldTerrain.html"
requires_credential = "CESIUM_ION_TOKEN"
ion_asset = 1

# --- tile cache: worker edge (L1) -> nginx origin (L2 + archive) -> upstream ---
# Per-entry policy: `cache_policy` if set, else direct when do_not_store_tiles or
# not an http raster, archive when the url has {date}, volatile otherwise.
# nginx conf is generated by scripts/tiles_nginx.py; docs/CACHE.md.
[tiles]
route = "/tiles"
origin_host = "origin.termalwave.space"
key_header = "X-TW-Origin-Key"
key_secret = "TILE_ORIGIN_KEY"
cache_root = "/var/cache/nginx/termalwave"
resolver = "1.1.1.1 1.0.0.1"
user_agent = "TermalWave/0.1 (+https://termalwave.space)"
# upstream 404s (out of range, not published yet) stay out of the archive
negative_valid = "10m"
# dated tiles this close to today may still be filling in upstream (orbit gaps)
recent_days = 3

[tiles.zones.archive]
name = "tw_tiles_archive"
keys_mb = 128
inactive = "3650d"
max_size = "50g"

[tiles.zones.volatile]
name = "tw_tiles_volatile"
keys_mb = 64
inactive = "30d"
max_size = "10g"

[tiles.policies.archive]
zone = "archive"
origin_valid = "3650d"
edge_ttl_s = 31536000
browser_ttl_s = 31536000
immutable = true

[tiles.policies.volatile]
zone = "volatile"
origin_valid = "7d"
edge_ttl_s = 604800
browser_ttl_s = 86400

[tiles.policies.recent]
zone = "volatile"
origin_valid = "6h"
edge_ttl_s = 3600
browser_ttl_s = 600

# Scene helpers — Cesium ion only required for 3D terrain; Google disabled
[scene]
cesium_ion_credential = "CESIUM_ION_TOKEN"
google_maps_enabled = false
google_maps_credential = "GOOGLE_MAPS_API_KEY"
google_maps_server_credential = "GOOGLE_MAPS_SERVER_API_KEY"

# --- space scene around the globe (sky, bodies, satellites, clouds) ---
# browser reads these through app-config.json; upstreams without cors go
# through the edge proxy routes, which cache them (dated answers archive)
[space]
sky_assets = "./sky/"
satellite_assets = "./satellites/"

[space.ephemeris]
endpoint = "/api/ephemeris"
upstream = "https://ssd.jpl.nasa.gov/api/horizons.api"
# horizons command ids: sun, moon, mercury, venus, mars, jupiter, saturn
bodies = { sun = "10", moon = "301", mercury = "199", venus = "299", mars = "499", jupiter = "599", saturn = "699" }
step_hours = 1

[space.satellites]
endpoint = "/api/satellites"
upstream = "https://celestrak.org/NORAD/elements/gp.php"
groups = ["sar", "weather", "stations"]
default_group = "sar"
highlight = ["NISAR", "SAOCOM 1A", "SAOCOM 1B", "SENTINEL-1C", "SENTINEL-1D", "ALOS-4 (DAICHI-4)"]
# celestrak asks clients not to refetch a group more than once per 2 hours
cache_ttl_s = 7200
min_elevation_deg = 10

[space.clouds]
endpoint = "/api/clouds"
upstream = "https://nowcoast.noaa.gov/geoserver/observations/satellite/ows"
layer = "global_longwave_imagery_mosaic"
attribution = "NOAA nowCOAST · NESDIS global infrared mosaic"
manifest_ttl_s = 600
max_zoom = 6

# Browser discovers the path; Worker implements it (see preview/src/nisar-coverage.js).
[space.nisar_coverage]
endpoint = "/api/nisar/coverage"
collection = "NISAR_L2_GCOV_V1"
temporal_start = "2025-07-30T00:00:00Z"
collections = [
  "NISAR_L2_GCOV_V1",
  "NISAR_L2_GCOV_PROVISIONAL_V1",
  "NISAR_L2_GCOV_BETA_V1",
]
cache_ttl_s = 600

# Live + archive wind (Open-Meteo; no key). Grid/point for particle overlay.
[space.wind]
endpoint = "/api/wind"
forecast = "https://api.open-meteo.com/v1/forecast"
archive = "https://archive-api.open-meteo.com/v1/archive"
cache_ttl_s = 900
attribution = "Open-Meteo (CC BY 4.0)"
