# Public API registry. Order and strategy only — no secrets here.
# Credentials live in config/secrets.local.toml (gitignored) or env vars named below.

[paths]
apis_config = "config/apis.toml"
secrets_local = "config/secrets.local.toml"
cache_dir = "data/cache"
fixtures_dir = "tests/fixtures/providers"
stats_out = "data/processed/stats.json"

[credentials]
# Names of keys expected in secrets.local.toml [credentials] or matching env vars.
# Full catalog: docs/APIS.md
earthdata_token_env = "EARTHDATA_TOKEN"
firms_map_key_env = "FIRMS_MAP_KEY"
meteomatics_user_env = "METEOMATICS_USER"
meteomatics_password_env = "METEOMATICS_PASSWORD"
planetary_computer_token_env = "PLANETARY_COMPUTER_TOKEN"
aisstream_api_key_env = "AISSTREAM_API_KEY"
opensky_client_id_env = "OPENSKY_CLIENT_ID"
opensky_client_secret_env = "OPENSKY_CLIENT_SECRET"
tomtom_api_key_env = "TOMTOM_API_KEY"
# Google Maps keys optional/disabled — see docs/api/REJECTED.md
google_maps_api_key_env = "GOOGLE_MAPS_API_KEY"
google_maps_server_api_key_env = "GOOGLE_MAPS_SERVER_API_KEY"
cesium_ion_token_env = "CESIUM_ION_TOKEN"

[fires]
order = ["firms_viirs_sp", "firms_viirs_nrt", "firms_modis"]
strategy = "union_dedupe"
dedupe_distance_km = 1.0
dedupe_time_hours = 12.0
# Lower quality_rank wins when deduping (SP preferred over NRT).
quality_rank = { firms_viirs_sp = 10, firms_viirs_nrt = 20, firms_modis = 30 }

[fires.endpoints]
firms_viirs_sp = "https://firms.modaps.eosdis.nasa.gov/api/area/csv/{MAP_KEY}/VIIRS_SNPP_SP/{west},{south},{east},{north}/{day_range}"
firms_viirs_nrt = "https://firms.modaps.eosdis.nasa.gov/api/area/csv/{MAP_KEY}/VIIRS_SNPP_NRT/{west},{south},{east},{north}/{day_range}"
firms_modis = "https://firms.modaps.eosdis.nasa.gov/api/area/csv/{MAP_KEY}/MODIS_SP/{west},{south},{east},{north}/{day_range}"

[weather]
order = ["open_meteo_archive", "meteomatics"]
strategy = "first_available"

[weather.endpoints]
open_meteo_archive = "https://archive-api.open-meteo.com/v1/archive"
meteomatics = "https://api.meteomatics.com"

[optical]
order = ["planetary_computer_s2"]
strategy = "least_cloudy_near_nisar"
max_cloud_pct = 40.0
max_day_delta = 16

[optical.endpoints]
planetary_computer_s2 = "https://planetarycomputer.microsoft.com/api/stac/v1/search"

[radar]
order = ["earthdata_nisar_gcov"]
strategy = "prefer_validated"
collection = "NISAR_L2_GCOV"

[radar.endpoints]
earthdata_nisar_gcov = "https://cmr.earthdata.nasa.gov/search/granules.json"

[providers.firms_viirs_sp]
kind = "fires"
module = "termalwave.providers.fires.firms_viirs_sp"
credential = "FIRMS_MAP_KEY"
product = "VIIRS_SNPP_SP"
license = "NASA FIRMS"

[providers.firms_viirs_nrt]
kind = "fires"
module = "termalwave.providers.fires.firms_viirs_nrt"
credential = "FIRMS_MAP_KEY"
product = "VIIRS_SNPP_NRT"
license = "NASA FIRMS"

[providers.firms_modis]
kind = "fires"
module = "termalwave.providers.fires.firms_modis"
credential = "FIRMS_MAP_KEY"
product = "MODIS_SP"
license = "NASA FIRMS"

[providers.open_meteo_archive]
kind = "weather"
module = "termalwave.providers.weather.open_meteo_archive"
credential = ""
product = "open-meteo-archive"
license = "Open-Meteo / CC-BY"

[providers.meteomatics]
kind = "weather"
module = "termalwave.providers.weather.meteomatics"
credential = "METEOMATICS_USER"
product = "meteomatics"
license = "Meteomatics proprietary"

[providers.planetary_computer_s2]
kind = "optical"
module = "termalwave.providers.optical.planetary_computer_s2"
credential = "PLANETARY_COMPUTER_TOKEN"
product = "sentinel-2-l2a"
license = "ESA Sentinel / Microsoft PC"

[providers.earthdata_nisar_gcov]
kind = "radar"
module = "termalwave.providers.radar.earthdata_nisar_gcov"
credential = "EARTHDATA_TOKEN"
product = "NISAR_L2_GCOV"
license = "NASA Earthdata"

# --- kinds pending full fetch (stubs return [] when credential present) ---

[vessels]
order = ["aisstream"]
strategy = "union_dedupe"

[vessels.endpoints]
aisstream = "https://stream.aisstream.io/v0/stream"

[aviation]
order = ["opensky"]
strategy = "first_available"

[aviation.endpoints]
opensky = "https://opensky-network.org/api"

[traffic]
order = ["tomtom_traffic"]
strategy = "first_available"

[traffic.endpoints]
tomtom_traffic = "https://api.tomtom.com"

[providers.aisstream]
kind = "vessels"
module = "termalwave.providers.vessels.aisstream"
credential = "AISSTREAM_API_KEY"
product = "aisstream"
license = "AISStream"

[providers.opensky]
kind = "aviation"
module = "termalwave.providers.aviation.opensky"
credential = "OPENSKY_CLIENT_ID"
product = "opensky"
license = "OpenSky Network"

[providers.tomtom_traffic]
kind = "traffic"
module = "termalwave.providers.traffic.tomtom_traffic"
credential = "TOMTOM_API_KEY"
product = "tomtom-traffic"
license = "TomTom"

# --- elevation (server-side only) ---

[elevation]
order = ["open_meteo_elevation", "opentopodata_srtm30m"]
strategy = "first_available_per_point"
disagree_meters = 30.0

[elevation.endpoints]
open_meteo_elevation = "https://api.open-meteo.com/v1/elevation"
opentopodata_srtm30m = "https://api.opentopodata.org/v1/srtm30m"

[providers.open_meteo_elevation]
kind = "elevation"
module = "termalwave.providers.elevation.open_meteo"
credential = ""
product = "open-meteo-elevation"
dem = "copernicus-glo90"
resolution_m = 90
license = "Open-Meteo / Copernicus DEM CC BY 4.0"
attribution = "Elevation data by Open-Meteo.com (CC BY 4.0), Copernicus DEM"
rate_limit = "600/min"
daily_cap = 10000
docs_url = "https://open-meteo.com/en/docs/elevation-api"
quality_rank = 10

[providers.opentopodata_srtm30m]
kind = "elevation"
module = "termalwave.providers.elevation.opentopodata"
credential = ""
product = "srtm30m"
dem = "srtm30m"
resolution_m = 30
license = "SRTM NASA/USGS via OpenTopoData"
attribution = "Elevation from SRTM (NASA/USGS) via OpenTopoData"
rate_limit = "1/s"
daily_cap = 1000
docs_url = "https://www.opentopodata.org/"
quality_rank = 20

# --- geocode (server-side only; no browser autocomplete) ---

[geocode]
search = ["photon", "open_meteo_geocode", "nominatim"]
reverse = ["photon", "nominatim"]
strategy = "first_nonempty"
dedupe_distance_m = 500.0
user_agent = "TermalWave/0.1 (+https://termalwave.space)"
rate_limit = "1/s"

[geocode.endpoints]
photon = "https://photon.komoot.io/api/"
photon_reverse = "https://photon.komoot.io/reverse"
open_meteo_geocode = "https://geocoding-api.open-meteo.com/v1/search"
nominatim = "https://nominatim.openstreetmap.org/search"
nominatim_reverse = "https://nominatim.openstreetmap.org/reverse"

[providers.photon]
kind = "geocode"
module = "termalwave.providers.geocode.photon"
credential = ""
product = "photon"
license = "ODbL (OpenStreetMap)"
attribution = "© OpenStreetMap contributors (via Photon/Komoot)"
rate_limit = "1/s"
docs_url = "https://github.com/komoot/photon"
quality_rank = 10

[providers.open_meteo_geocode]
kind = "geocode"
module = "termalwave.providers.geocode.open_meteo"
credential = ""
product = "open-meteo-geocoding"
license = "Open-Meteo CC BY 4.0"
attribution = "Geocoding by Open-Meteo.com (CC BY 4.0)"
rate_limit = "600/min"
docs_url = "https://open-meteo.com/en/docs/geocoding-api"
quality_rank = 20

[providers.nominatim]
kind = "geocode"
module = "termalwave.providers.geocode.nominatim"
credential = ""
product = "nominatim"
license = "ODbL (OpenStreetMap)"
attribution = "© OpenStreetMap contributors (Nominatim)"
user_agent = "TermalWave/0.1 (+https://termalwave.space)"
rate_limit = "1/s"
docs_url = "https://nominatim.org/release-docs/latest/api/Overview/"
quality_rank = 30

# --- basemaps (frontend config only; emitted into app-config.json) ---

[basemaps]
default = "gibs_modis_truecolor"
# Streets = CARTO (OSM) raster — OpenFreeMap vector needs MapLibre style swap (carne).
# GIBS truecolor lags: VIIRS often ~10–14d behind; MODIS ~2–4d. date_lag_days per entry.
list = [
  "gibs_modis_truecolor",
  "gibs_viirs_truecolor",
  "carto_voyager",
  "carto_dark_matter",
  "openfreemap_liberty",
  "eox_s2cloudless_2025",
  "cesium_world_terrain",
]
engine_primary = "maplibre"
engine_fallback_2d = "leaflet"
cesium_ion_asset_world_terrain = 1
cesium_ion_asset_sentinel2_test = 3954

[basemaps.entries.gibs_modis_truecolor]
id = "gibs_modis_truecolor"
label = "NASA GIBS MODIS"
kind = "raster"
url_template = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/{date}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg"
attribution = "We acknowledge the use of imagery provided by services from NASA's Global Imagery Browse Services (GIBS), part of NASA's Earth Science Data and Information System (ESDIS)."
license = "NASA GIBS"
max_zoom = 9
time_dimension = true
date_lag_days = 4
docs_url = "https://wiki.earthdata.nasa.gov/display/GIBS"

[basemaps.entries.gibs_viirs_truecolor]
id = "gibs_viirs_truecolor"
label = "NASA GIBS VIIRS"
kind = "raster"
url_template = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/{date}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg"
attribution = "We acknowledge the use of imagery provided by services from NASA's Global Imagery Browse Services (GIBS), part of NASA's Earth Science Data and Information System (ESDIS)."
license = "NASA GIBS"
max_zoom = 9
time_dimension = true
date_lag_days = 14
docs_url = "https://wiki.earthdata.nasa.gov/display/GIBS"

[basemaps.entries.carto_voyager]
id = "carto_voyager"
label = "Calles (CARTO Voyager)"
kind = "raster"
url_template = "https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png"
attribution = "© OpenStreetMap contributors · © CARTO"
license = "ODbL / CARTO"
max_zoom = 20
time_dimension = false
docs_url = "https://carto.com/basemaps/"
purpose = "streets"

[basemaps.entries.carto_dark_matter]
id = "carto_dark_matter"
label = "Calles oscuras (CARTO)"
kind = "raster"
url_template = "https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png"
attribution = "© OpenStreetMap contributors · © CARTO"
license = "ODbL / CARTO"
max_zoom = 20
time_dimension = false
docs_url = "https://carto.com/basemaps/"
purpose = "streets"

[basemaps.entries.openfreemap_liberty]
id = "openfreemap_liberty"
label = "Calles vector (OpenFreeMap)"
kind = "vector"
url_template = "https://tiles.openfreemap.org/styles/liberty"
attribution = "© OpenStreetMap contributors · OpenFreeMap © OpenMapTiles"
license = "ODbL / OpenMapTiles"
max_zoom = 14
time_dimension = false
docs_url = "https://openfreemap.org/"
engines = ["maplibre"]
purpose = "streets"

[basemaps.entries.eox_s2cloudless_2025]
id = "eox_s2cloudless_2025"
label = "Sentinel-2 sin nubes (EOX)"
kind = "raster"
url_template = "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2025_3857/default/g/{z}/{y}/{x}.jpg"
attribution = "EOxCloudless https://cloudless.eox.at by EOX IT Services GmbH (Contains modified Copernicus Sentinel data 2025)"
license = "CC BY-NC-SA 4.0"
max_zoom = 16
time_dimension = false
docs_url = "https://tiles.maps.eox.at/"
do_not_store_tiles = true

[basemaps.entries.cesium_world_terrain]
id = "cesium_world_terrain"
label = "Relieve Cesium"
kind = "terrain"
url_template = "ion://1"
attribution = "Cesium World Terrain · Cesium ion"
license = "Cesium ion"
max_zoom = 15
time_dimension = false
docs_url = "https://cesium.com/learn/cesiumjs/ref-doc/createWorldTerrain.html"
requires_credential = "CESIUM_ION_TOKEN"
ion_asset = 1

# Scene helpers — Cesium ion only required for 3D terrain; Google disabled
[scene]
cesium_ion_credential = "CESIUM_ION_TOKEN"
google_maps_enabled = false
google_maps_credential = "GOOGLE_MAPS_API_KEY"
google_maps_server_credential = "GOOGLE_MAPS_SERVER_API_KEY"
