module = "termalwave.providers.geocode.open_meteo"
credential = ""
product = "open-meteo-geocoding"
license = "Open-Meteo CC BY 4.0"
attribution = "Geocoding by Open-Meteo.com (CC BY 4.0)"
rate_limit = "600/min"
docs_url = "https://open-meteo.com/en/docs/geocoding-api"
quality_rank = 20

[providers.nominatim]
