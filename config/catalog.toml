caveats_es = "Sin unidad: la profundidad óptica es una proporción. Rojo más oscuro significa más aerosol. El radar atraviesa el humo; esta capa no."
product = "MODIS combined value-added aerosol optical depth (GIBS: MODIS_Combined_Value_Added_AOD)"
attribution = "NASA GIBS / MODIS AOD"
source_url = "https://ladsweb.modaps.eosdis.nasa.gov/"
inputs = [{ name = "Aerosol optical depth", agency = "NASA", product = "MODIS Terra and Aqua AOD", url = "https://ladsweb.modaps.eosdis.nasa.gov/" }]

