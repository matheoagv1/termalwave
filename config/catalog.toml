# Label rules (owner, 2026-11-15). Every [[catalog]] entry in every catalog*.toml follows them.
# - label_en / label_es: two or three plain words that say what the layer shows or does:
#   "Active fires", "Rain now", "Soil moisture", "Ground motion", "Fire danger, 3 days".
# - No product codes, acronyms, agency names or jargon in labels (no "FIRMS", "NDVI", "GCOV", "SMAP").
#   Those go in `product`, `attribution` and `inputs`.
# - English by default, Spanish (es-AR, with accents) in label_es. Never Spanish-only words in label_en.
# - Processed and prediction entries also carry, for the "How this is made" panel:
#   inputs = [{ name = "...", agency = "...", product = "...", url = "https://..." }, ...]  (one per source used)
#   method_en / method_es = 3 to 5 plain sentences: from the inputs to the value, and what the number means.
# - Set `theme` to the closest preset id: cambio, fuego, clima, vegetacion, agua, movimiento.


# Raw catalog layers: measured products drawn on the globe as the source serves them.
# Owned by agent "catalog". Contract: see the [[catalog]] fields in docs and
# web/src/scene/catalog/entries.ts. Every config/catalog*.toml is read, sorted by
# file name; on a duplicate id the first one wins.
#
# The web bundle reads these files with a small TOML reader. Keep to: comments,
# [[catalog]] tables, key = value, "basic" or 'literal' strings (triple quotes
# allowed), numbers, booleans, arrays (multi-line allowed) and inline tables.
#
# GIBS urls use the REST form .../{Layer}/default/{date}/{TileMatrixSet}/{z}/{y}/{x}.png
# with identifiers and tile matrix sets taken from the GIBS WMTS GetCapabilities.
# Ramps and ranges follow the GIBS colormap of each product; where the colormap is
# a set of classes, the range is left out rather than invented.

# ---------- Weather ----------

[[catalog]]
id = "rain_now"
tier = "raw"
kind = "raster_tiles"
theme = "clima"
url = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/IMERG_Precipitation_Rate/default/{date}/GoogleMapsCompatible_Level6/{z}/{y}/{x}.png"
time = "daily"
date_lag_days = 2
max_zoom = 6
opacity = 0.7
unit = "mm/h"
range = [0.1, 53]
ramp = [["#00764e", 0.0], ["#17b000", 0.2], ["#e6ec00", 0.4], ["#ff532a", 0.6], ["#bb0000", 0.8], ["#330000", 1.0]]
honesty = "measured"
label_en = "Rain"
label_es = "Lluvia"
what_en = "Rain rate estimated from the GPM satellite constellation, one daily image."
what_es = "Intensidad de lluvia estimada por la constelación de satélites GPM, una imagen por día."
decision_en = "Check if recent rain explains wetter soil or a change in the radar signal."
decision_es = "Verificá si la lluvia reciente explica un suelo más húmedo o un cambio en la señal del radar."
nodata_en = "Transparent means less than 0.1 mm/h or no estimate for that cell."
nodata_es = "Transparente significa menos de 0,1 mm/h o sin estimación para esa celda."
caveats_en = "About 10 km cells. Satellite estimate, not a rain gauge. The colour scale is logarithmic. The image is two days behind today."
caveats_es = "Celdas de unos 10 km. Es una estimación satelital, no un pluviómetro. La escala de color es logarítmica. La imagen va dos días atrás de hoy."
product = "GPM IMERG precipitation rate (GIBS: IMERG_Precipitation_Rate)"
attribution = "NASA GIBS / GPM IMERG"
source_url = "https://gpm.nasa.gov/data/imerg"
inputs = [{ name = "Precipitation rate", agency = "NASA / JAXA", product = "GPM IMERG", url = "https://gpm.nasa.gov/data/imerg" }]

[[catalog]]
id = "ground_heat_day"
tier = "raw"
kind = "raster_tiles"
theme = "clima"
url = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_L3_Land_Surface_Temp_Daily_Day/default/{date}/GoogleMapsCompatible_Level7/{z}/{y}/{x}.png"
time = "daily"
date_lag_days = 2
max_zoom = 7
opacity = 0.75
unit = "K"
range = [200, 350]
ramp = [["#c900ff", 0.0], ["#0100ff", 0.2], ["#04fff7", 0.4], ["#bdff00", 0.6], ["#ff9d00", 0.8], ["#ff0100", 1.0]]
honesty = "measured"
label_en = "Ground heat"
label_es = "Calor del suelo"
what_en = "Temperature of the land surface in the late morning, seen from orbit by MODIS on Terra."
what_es = "Temperatura de la superficie del terreno a media mañana, vista desde órbita por MODIS en Terra."
decision_en = "Spot hot, dry ground or burn scars, and compare with radar change after a drought or a fire."
decision_es = "Ubicá suelo caliente y seco o áreas quemadas, y comparalo con el cambio del radar después de una sequía o un incendio."
nodata_en = "Transparent means clouds hid the ground or the satellite did not pass that day."
nodata_es = "Transparente significa que las nubes taparon el suelo o que el satélite no pasó ese día."
caveats_en = "Ground skin temperature, not air temperature. About 1 km cells. Units are kelvin: 273 K is 0 °C."
caveats_es = "Es la temperatura de la piel del suelo, no del aire. Celdas de alrededor de 1 km. Las unidades son kelvin: 273 K equivalen a 0 °C."
product = "MODIS Terra land surface temperature, daily, day (GIBS: MODIS_Terra_L3_Land_Surface_Temp_Daily_Day)"
attribution = "NASA GIBS / MODIS Terra LST"
source_url = "https://lpdaac.usgs.gov/products/mod11a1v061/"
inputs = [{ name = "Land surface temperature", agency = "NASA", product = "MODIS Terra MOD11A1", url = "https://lpdaac.usgs.gov/products/mod11a1v061/" }]

[[catalog]]
id = "haze_smoke"
tier = "raw"
kind = "raster_tiles"
theme = "fuego"
url = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Combined_Value_Added_AOD/default/{date}/GoogleMapsCompatible_Level6/{z}/{y}/{x}.png"
time = "daily"
date_lag_days = 2
max_zoom = 6
opacity = 0.7
ramp = [["#fffdcd", 0.0], ["#ffd960", 0.2], ["#ff9729", 0.4], ["#ff4514", 0.6], ["#d5080b", 0.8], ["#7d000e", 1.0]]
honesty = "measured"
label_en = "Smoke and haze"
label_es = "Humo y bruma"
what_en = "How much smoke, dust and haze the air holds, as aerosol optical depth from MODIS on Terra and Aqua."
what_es = "Cuánto humo, polvo y bruma tiene el aire, como profundidad óptica de aerosoles de MODIS en Terra y Aqua."
decision_en = "See where smoke from fires travels and where it may hide the ground from optical satellites."
decision_es = "Mirá hacia dónde viaja el humo de los incendios y dónde puede tapar el suelo a los satélites ópticos."
nodata_en = "Transparent means clouds, bright ground or no pass that day."
nodata_es = "Transparente significa nubes, suelo muy claro o que no hubo pasada ese día."
